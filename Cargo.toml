[workspace]
resolver = "3"
members = [
    "crates/shared/*",
    "crates/keeper/*",
    "crates/window/*",
    "companions/claude",
    "system-tests",
    "xtask",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
yaar-link = { path = "crates/shared/link" }
yaar-diff = { path = "crates/shared/diff" }
yaar-recorder = { path = "crates/keeper/recorder" }
yaar-store = { path = "crates/keeper/store" }
yaar-workspaces = { path = "crates/keeper/workspaces" }
yaar-review-engine = { path = "crates/keeper/review-engine" }
yaar-dock = { path = "crates/keeper/dock" }
yaar-frame = { path = "crates/window/frame" }
yaar-review-pane = { path = "crates/window/review-pane" }
yaar-terminal-pane = { path = "crates/window/terminal-pane" }
yaar-agent = { path = "crates/shared/agent" }
yaar-switchboard = { path = "crates/keeper/switchboard" }
yaar-adapter-claude = { path = "crates/keeper/adapter-claude" }
yaar-adapter-pi = { path = "crates/keeper/adapter-pi" }
yaar-system-tests = { path = "system-tests" }
yaar-navigator = { path = "crates/window/navigator" }
yaar-text-search = { path = "crates/window/text-search" }
# Exact version, raised by hand with the patch script of patches/.
# Without the kit's icon set: the app ships only the icons it uses.
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component"] }
libc = "0.2"
serde_json = "1"
toml = "1"
# At an exact version: the hunks have to stay those of git's histogram diff.
imara-diff = { version = "=0.2.0", default-features = false }
# For tests only. Not older than 0.9.1, which bounds what a block unpacks to.
ruzstd = "=0.9.1"
# At an exact version: the binding fixes the version of SQLite itself.
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
async-channel = "2.5"
# At an exact version: the answers the app gives programs rest on its handling of the escape
# sequences.
alacritty_terminal = { version = "=0.26.0", default-features = false }
notify = { version = "=8.2.2", default-features = false, features = ["macos_fsevent"] }
# TLS through rustls with ring, both already linked by the Window beneath the toolkit.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
ring = "=0.17.14"
flate2 = "=1.1.11"
tar = { version = "=0.4.46", default-features = false }
url = "=2.5.9"
ignore = "=0.4.34"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
grep-matcher = "=0.1.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0

# The diff has a time limit that a test holds it to, and tests are built with this profile.
[profile.dev.package.imara-diff]
opt-level = 3

[profile.dev.package.yaar-diff]
opt-level = 3

# The text match has a time limit a test holds it to too, so it and the walk and search
# crates below are built optimised, as the app ships them.
[profile.dev.package.yaar-text-search]
opt-level = 3

[profile.dev.package.ignore]
opt-level = 3

[profile.dev.package.globset]
opt-level = 3

[profile.dev.package.grep-searcher]
opt-level = 3

[profile.dev.package.grep-regex]
opt-level = 3

[profile.dev.package.grep-matcher]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

# The vendored GPUI is patched so that the older frame source is the default on macOS
# (patches/README.md).
[patch.crates-io]
gpui-pre-apple = { path = "vendor/gpui-pre-apple-0.3.12" }
