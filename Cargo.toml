# One workspace, one crate per component of the architecture. The rules between the crates
# are checked by `cargo xtask layout`.
[workspace]
resolver = "3"
members = [
    "crates/shared/*",
    "crates/keeper/*",
    "crates/window/*",
    "companions/claude",
    "system-tests",
    "xtask",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
yaar-link = { path = "crates/shared/link" }
yaar-diff = { path = "crates/shared/diff" }
yaar-recorder = { path = "crates/keeper/recorder" }
yaar-store = { path = "crates/keeper/store" }
yaar-workspaces = { path = "crates/keeper/workspaces" }
yaar-review-engine = { path = "crates/keeper/review-engine" }
yaar-dock = { path = "crates/keeper/dock" }
yaar-frame = { path = "crates/window/frame" }
yaar-review-pane = { path = "crates/window/review-pane" }
yaar-terminal-pane = { path = "crates/window/terminal-pane" }
yaar-system-tests = { path = "system-tests" }
# GPUI through the fork's kit, at an exact version: raised by hand, with the patch script
# of patches/ and the speed check on the reference Mac.
# Without the kit's icon set: the app ships only the icons it uses, and uses none yet.
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component"] }
libc = "0.2"
serde_json = "1"
toml = "1"
# The line diff, at an exact version: the hunks have to stay those of git's histogram diff.
# Without its printer of unified diffs, which the app does not use.
imara-diff = { version = "=0.2.0", default-features = false }
# Unpacks the recorded changes that the tests of the diff are held to. For tests only: no
# program a user gets holds it. Not older than 0.9.1, which bounds what a block unpacks to.
ruzstd = "=0.9.1"
# SQLite compiled into the Keeper, at an exact version: the binding fixes the version of
# SQLite itself.
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
# Hands what one thread reads to the thread that draws.
async-channel = "2.5"
# The terminal emulator of the Terminal pane, at an exact version: the app paints its
# grid and encodes the keys itself, and the answers it gives programs rest on this
# version's handling of the escape sequences. Without its optional serde support.
alacritty_terminal = { version = "=0.26.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0

# The diff has a time limit that a test holds it to, and tests are built with this profile.
[profile.dev.package.imara-diff]
opt-level = 3

[profile.dev.package.yaar-diff]
opt-level = 3

[profile.release]
opt-level = 3
debug = false

# The one changed file of GPUI: the older frame source is the default on macOS.
# See patches/README.md.
[patch.crates-io]
gpui-pre-apple = { path = "vendor/gpui-pre-apple-0.3.12" }
