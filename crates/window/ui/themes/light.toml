# The light theme, copied from the light theme of GitHub's Primer design system
# (@primer/primitives 11.10.0, MIT). Every value that is not Primer's own says why on its line.
name = "Light"
appearance = "light"

[colors]
window = "#f6f8fa"
pane = "#ffffff"
# Primer's selected-control wash (#818b9826) laid over the window.
raised = "#e5e8eb"
overlay = "#c8d1da66"
edge = "#d1d9e0"
separator = "#d1d9e0b3"
text = "#1f2328"
text_muted = "#59636e"
# The dimmest step of the muted text's hue that reads 4.5 to 1 on every ground it is drawn on
# (2 lightness points above it; a third would fall short on the raised ground).
text_dim = "#5e6874"
text_on_accent = "#ffffff"
# White, where Primer's default text (#1f2328) reads only 3.2 to 1 on Primer's amber (#9a6700):
# no step of darkening the text reaches 4.5, as black reads 4.3.
text_on_warn = "#ffffff"
accent = "#0969da"
# Primer's own hover is the green of its primary button; this is the next darker blue.
accent_hover = "#0550ae"
# Darkened 2 points from #0969da: it read 4.22 to 1 on the raised ground.
accent_text = "#0964d0"
link = "#0964d0"
focus = "#0969da"
selection = "#ddf4ff"
# Darkened 5 points from #1a7f37: it read 4.49 to 1 on the raised ground.
ok = "#166a2e"
# Darkened 5 points from #9a6700: it read 4.30 to 1 on the raised ground.
warn = "#805600"
# Darkened 2 points from #d1242f: it read 4.26 to 1 on the raised ground.
danger = "#c8232d"
# Darkened 2 points from #0969da: it read 4.22 to 1 on the raised ground.
info = "#0964d0"
add_text = "#1a7f37"
add_ground = "#dafbe1"
add_bar = "#aceebb"
add_word = "#aceebb"
del_text = "#d1242f"
del_ground = "#ffebe9"
del_bar = "#ffcecb"
del_word = "#ffcecb"
fold_ground = "#f6f8fa"
gap_stripe = "#d1d9e0b3"
syn_keyword = "#cf222e"
syn_function = "#6639ba"
syn_string = "#0a3069"
syn_number = "#0550ae"
syn_comment = "#59636e"

[terminal]
foreground = "#1f2328"
background = "#ffffff"
cursor = "#1f2328"
selection = "#ddf4ff"
ansi = [
    "#1f2328", "#cf222e", "#116329", "#4d2d00",
    "#0969da", "#8250df", "#1b7c83", "#59636e",
    "#393f46", "#a40e26", "#1a7f37", "#633c01",
    "#218bff", "#a475f9", "#3192aa", "#818b98",
]
