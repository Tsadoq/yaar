# Rust: rust-analyzer. The toolchain's own, through rustup's program of that name on the
# search path, which runs the project's toolchain, comes first; then any other on the
# machine; then the one the app downloaded. It needs the machine's Rust toolchain, which no
# row can supply.
[rust]
title = "Rust"
markers = ["Cargo.toml"]

[rust.extensions]
rs = "rust"

[[rust.server]]
name = "rust-analyzer"
machine = ["rust-analyzer"]
trial = ["--version"]
ready = { kind = "notification", method = "experimental/serverStatus", match = { quiescent = true } }

# rust-analyzer tells its status only to a client that asks for it.
[rust.server.capabilities.experimental]
serverStatusNotification = true

# No `cargo check` after each load, and every build output in a folder of the app's own,
# never in the project's `target`.
[rust.server.initialization_options]
checkOnSave = false
cargo = { targetDir = "{target}" }

[rust.server.settings.rust-analyzer]
checkOnSave = false
cargo = { targetDir = "{target}" }

[rust.server.environment]
CARGO_TARGET_DIR = "{target}"

