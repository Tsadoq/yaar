# Its answers are syntax-only, and wrong, until its progress report ends.
[[typescript.server]]
name = "typescript-language-server"
project = ["node_modules/.bin/typescript-language-server"]
machine = ["typescript-language-server"]
trial = ["--version"]
args = ["--stdio"]
ready = { kind = "progress" }

[[typescript.server]]
name = "vtsls"
project = ["node_modules/.bin/vtsls"]
machine = ["vtsls"]
trial = ["--version"]
args = ["--stdio"]
ready = { kind = "progress" }

# Python: basedpyright and pyright on the machine's Node, ty and pyrefly native, in the
# project's virtual environment first, then on the machine (ADR-015 point 5). Only ty is
# downloaded.
[python]
title = "Python"
markers = ["pyproject.toml", "setup.py", "setup.cfg", "requirements.txt"]

[python.extensions]
py = "python"
pyi = "python"

# The old code reads the packages of the worktree's virtual environment.
[python.old_side]
link = [".venv"]

# basedpyright finds a project's .venv itself; it has no --version.
[[python.server]]
name = "basedpyright"
project = [".venv/bin/basedpyright-langserver"]
machine = ["basedpyright-langserver"]
args = ["--stdio"]
ready = { kind = "answer" }

# pyright does not look for .venv: it is told the interpreter there.
[[python.server]]
name = "pyright"
project = [".venv/bin/pyright-langserver"]
machine = ["pyright-langserver"]
args = ["--stdio"]
ready = { kind = "answer" }

[python.server.settings.python]
pythonPath = "{root}/.venv/bin/python"

[[python.server]]
name = "ty"
project = [".venv/bin/ty"]
machine = ["ty"]
trial = ["--version"]
args = ["server"]
ready = { kind = "answer" }

