# The built-in table of language servers. The user's own file,
# <the app's data folder>/language-servers.toml, has the same form, and a row there with
# the name of a row here takes its place. The form is written down in src/registry.rs.
#
# A language is added by one row here, and by no change of code (NFR-002). The servers of a
# row are tried in the order of FR-060: the one the user registered, the project's own, one
# installed on the machine, one the app downloaded; within each kind in the order written
# here. Only the native servers that need no Node are downloaded, each pinned to a version
# and to the SHA-256 digest of the bytes the publisher serves, and fetched from the
# publisher's own address only when the user accepts the offer.

# TypeScript and JavaScript: TypeScript 7's own server, one native program, first; then the
# servers that run on the machine's Node, found only, never downloaded (ADR-015 point 5).
[typescript]
title = "TypeScript and JavaScript"
markers = ["tsconfig.json", "jsconfig.json", "package.json"]

[typescript.extensions]
ts = "typescript"
tsx = "typescriptreact"
mts = "typescript"
cts = "typescript"
js = "javascript"
jsx = "javascriptreact"
mjs = "javascript"
cjs = "javascript"

# The old code reads the types of the worktree's dependencies.
[typescript.old_side]
link = ["node_modules"]

[[typescript.server]]
name = "tsgo"
# The platform package a project that depends on typescript 7 holds.
project = ["node_modules/@typescript/typescript-{platform}/lib/tsc"]
machine = ["tsgo"]
trial = ["--version"]
args = ["--lsp", "--stdio"]
ready = { kind = "answer" }

# Off: the automatic acquisition of types, by which the server runs npm and installs type
# packages into the user's cache folder for a file outside every project. The server asks
# for these three sections; each holds the switch.
[typescript.server.settings."js/ts".tsserver.automaticTypeAcquisition]
enabled = false

[typescript.server.settings.typescript.tsserver.automaticTypeAcquisition]
enabled = false

[typescript.server.settings.javascript.tsserver.automaticTypeAcquisition]
enabled = false

[[typescript.server.download]]
platform = "darwin-arm64"
version = "7.0.2"
url = "https://registry.npmjs.org/@typescript/typescript-darwin-arm64/-/typescript-darwin-arm64-7.0.2.tgz"
