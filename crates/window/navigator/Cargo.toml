[package]
name = "yaar-navigator"
description = "Navigator: language servers for the code on screen, their registry and downloads, and the old side of a diff"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The stand-in language server of the tests, for an invented language: it sits with the
# Navigator's component tests. No package ships it.
[[bin]]
name = "standin-lsp"
path = "src/bin/standin-lsp.rs"

[dependencies]
yaar-link.workspace = true
yaar-diff.workspace = true
yaar-text-search.workspace = true
# Hands the asks and the answers between the Frame and the Navigator's thread.
async-channel.workspace = true
# The messages of the Language Server Protocol, and the settings a row sends.
serde_json.workspace = true
# The registry: the built-in table and the user's file.
toml.workspace = true
# Ends a server whose Window went (Linux), and asks whether a process lives.
libc.workspace = true
url.workspace = true
ureq.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
ring.workspace = true
flate2.workspace = true
tar.workspace = true

# Named until the package of slice 8 that first uses each takes its name out.
[package.metadata.cargo-machete]
ignored = ["flate2", "libc", "ring", "rustls", "rustls-native-certs", "tar", "toml", "url", "yaar-diff"]

[lints]
workspace = true
