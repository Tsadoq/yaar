[package]
name = "yaar-keeper"
description = "The Keeper: the background program that outlives the window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "yaar-keeper"
path = "src/main.rs"

[dependencies]
yaar-link.workspace = true
libc.workspace = true
yaar-recorder.workspace = true
yaar-store.workspace = true
yaar-workspaces.workspace = true
yaar-dock.workspace = true
yaar-review-engine.workspace = true
yaar-agent.workspace = true
yaar-switchboard.workspace = true
yaar-adapter-claude.workspace = true

# Used by the builders of slice 4; the contract has signatures only.
[package.metadata.cargo-machete]
ignored = ["yaar-adapter-claude", "yaar-agent", "yaar-switchboard"]

[lints]
workspace = true
