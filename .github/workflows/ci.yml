# Nothing is published, uploaded or sent to Apple unless this workflow is started on a version tag
# with the input `publish` on: by the job `release` after a green run on main, when the repository
# variable RELEASES is `on`, or by hand. The job `version` computes that once, and
# release-sign-macos, assemble-release and publish run only when it holds.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this tag as a release. Off: a rehearsal that publishes nothing."
        type: boolean
        default: false

permissions:
  contents: read

# A pull request's run gives way to a newer one. Other runs of one branch or tag wait for each
# other, so that the runs on main go one by one. All runs that publish, a dispatch with publish on a
# tag, share one group, whatever their tag: none is cancelled while it runs, but a publishing run that
# waits is replaced by a newer one that queues, and never starts.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag' && 'ci-publish' || format('ci-{0}-{1}-check', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.run.outputs.version }}
      later: ${{ steps.run.outputs.later }}
      publish: ${{ steps.run.outputs.publish }}
    steps:
      # Every branch, so that a publishing run can check that its tag's commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What this run is
        id: run
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/what-this-run-is.sh

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The commits between the head and the tip of the base branch have to be there: the script lists
      # base..head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit of the pull request, merge commits apart, has a subject of the form type(scope) colon description
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/commit-lint.sh "origin/$BASE_REF" "$HEAD_SHA"

  checks-linux:
    name: checks linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    timeout-minutes: 45
    steps:
      # strace: a system test traces the files the Keeper and the Companion open.
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc libc6-dev pkg-config libfontconfig-dev \
            libxkbcommon-x11-dev fonts-dejavu-core jq strace

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pi's extension is TypeScript and its test runs it under Node's own type stripping; nothing
      # the packages ship holds Node: the user's pi runs the extension.
      - name: Node, for the test of pi's extension
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1
          package-manager-cache: false

      - name: Rust toolchain named in rust-toolchain.toml
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/rustc" -vV

      - name: Restore crates and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: checks-${{ runner.os }}-${{ matrix.arch }}-ubuntu24.04-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            checks-${{ runner.os }}-${{ matrix.arch }}-ubuntu24.04-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check tools
        run: .github/scripts/install-tools.sh "$HOME/.cargo/bin" nextest deny machete

      - name: Fetch crates
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all --check

      # A test that needs them fails, and never skips, where the folder is missing or incomplete.
      - name: Restore the language servers of the tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/yaar-language-servers
          key: language-servers-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('crates/window/navigator/registry.toml') }}

      - name: The language servers of the tests
        run: |
          cargo xtask language-servers "$HOME/yaar-language-servers"
          echo "YAAR_LANGUAGE_SERVERS=$HOME/yaar-language-servers" >> "$GITHUB_ENV"

      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo nextest run --locked --workspace

      - name: Licences, advisories, bans, sources
        run: cargo deny check

      - name: The app's own licence
        run: .github/scripts/own-licence.sh

      # A new key of this job has to be made known to plant.sh.
      - name: A dependency under a licence outside the list is refused
        run: .github/scripts/plant.sh licence

      - name: A planted web view is refused
        run: .github/scripts/plant.sh ban wry

      - name: A planted JavaScript runtime is refused
        run: .github/scripts/plant.sh ban deno_core

      - name: A crate from a git repository is refused, as one of the Zed editor would be
        run: .github/scripts/plant.sh git

      - name: A planted crate of the Zed editor is refused
        run: .github/scripts/plant.sh ban gpui

      # The toolkit links this one, and the tree passes with it there.
      - name: A crate Zed publishes is refused anywhere but beneath the interface toolkit
        run: .github/scripts/plant.sh ban zed-font-kit

      - name: The licence check and the planted checks can fail
        run: .github/scripts/checks-can-fail.sh

      - name: Unused dependencies
        run: cargo machete

      - name: Layout rules
        run: cargo xtask layout

      - name: The commit check passes each form that is right and names each commit that is wrong
        run: .github/scripts/commit-lint-check.sh

      - name: The next version and the notes of a tag follow the commit messages, on scratch repositories
        run: packaging/release/next-version-check.sh

      - name: A bump changes the version in Cargo.toml and Cargo.lock alone, and the lock file still holds
        run: packaging/release/bump-check.sh

      - name: A release is one push and one run, and nothing goes out when it is off, when there is nothing to release, when main moved or when the tag exists
        run: packaging/release/release-check.sh

      - name: The notes of a release are the changes of its tag, then the fixed text
        run: .github/scripts/publish-notes-check.sh

      - name: A release is the latest and the site is deployed only when no published release has a greater version
        run: .github/scripts/publish-latest-check.sh

  macos:
    name: macos universal
    needs: version
    # macOS 26: the version before the current one, which the release promises on the strength
    # of this job.
    runs-on: macos-26
    # A run after a change of the lock file builds everything from nothing.
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node, for the test of pi's extension
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1
          package-manager-cache: false

      - name: Rust toolchain named in rust-toolchain.toml, plus the Intel target
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin
          rustc -vV
          sw_vers

      - name: Restore crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: macos-crates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-crates-${{ runner.os }}-${{ runner.arch }}-

      # A publishing run builds from nothing: no earlier build output goes into what is signed.
      - name: Restore build output
        if: needs.version.outputs.publish != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check tools
        run: .github/scripts/install-tools.sh "${CARGO_HOME:-$HOME/.cargo}/bin" nextest about

      - name: Fetch crates
        run: cargo fetch --locked

      - name: Restore the language servers of the tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/yaar-language-servers
          key: language-servers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/window/navigator/registry.toml') }}

      - name: The language servers of the tests
        run: |
          cargo xtask language-servers "$HOME/yaar-language-servers"
          echo "YAAR_LANGUAGE_SERVERS=$HOME/yaar-language-servers" >> "$GITHUB_ENV"

      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo nextest run --locked --workspace

      - name: Layout rules
        run: cargo xtask layout

      - name: The programs the install job drives the app with
        run: cargo build --locked -p yaar-system-tests --bins

      - name: Release build, both processors
        run: .github/scripts/release-build.sh --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Third-party notices
        run: packaging/notices.sh dist/THIRD-PARTY-NOTICES.txt aarch64-apple-darwin x86_64-apple-darwin

      # Ad hoc: the Developer ID and the notary key are secrets of the environment `release`,
      # which only release-sign-macos may name.
      - name: The app, the .zip and the disk image, signed ad hoc
        run: |
          NOTICES=dist/THIRD-PARTY-NOTICES.txt packaging/package-macos.sh "$VERSION" dist \
            target/aarch64-apple-darwin/release target/x86_64-apple-darwin/release

      - name: Signature and processors
        run: |
          codesign --verify --deep --strict --verbose=2 dist/YAAR.app
          codesign --display --verbose=4 dist/YAAR.app
          for p in MacOS/yaar-review Helpers/yaar-keeper Helpers/yaar-claude-hook \
                   Helpers/yaar-claude-tools Helpers/yaar-pi-report; do
            echo "$p: $(lipo -archs "dist/YAAR.app/Contents/$p")"
            codesign --verify --strict --verbose=1 "dist/YAAR.app/Contents/$p"
          done

      - name: The packaged Window program starts the packaged Keeper, which outlives it
        run: |
          export YAAR_SOCKET="$RUNNER_TEMP/k.sock"
          first=$(dist/YAAR.app/Contents/MacOS/yaar-review --keeper-status); echo "$first"
          second=$(dist/YAAR.app/Contents/MacOS/yaar-review --keeper-status); echo "$second"
          case "$first" in *"started=true"*) ;; *) echo "the first call did not start a Keeper"; exit 1 ;; esac
          case "$second" in *"started=false"*) ;; *) echo "the second call started another Keeper"; exit 1 ;; esac
          pid=$(printf '%s\n' "$first" | tr ' ' '\n' | sed -n 's/^pid=//p')
          ps -o pid,ppid,command -p "$pid"
          ps -o command= -p "$pid" | grep -q 'YAAR.app/Contents/Helpers/yaar-keeper'
          codesign --verify --verbose=1 "$pid"

      - name: What the Mac bundle holds
        run: .github/scripts/macos-bundle-check.sh dist/YAAR.app "$VERSION" dist/THIRD-PARTY-NOTICES.txt dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      # An artifact keeps no execute bit; the packaging script sets it again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-programs
          path: |
            target/aarch64-apple-darwin/release/yaar-review
            target/aarch64-apple-darwin/release/yaar-keeper
            target/aarch64-apple-darwin/release/yaar-claude-hook
            target/aarch64-apple-darwin/release/yaar-claude-tools
            target/aarch64-apple-darwin/release/yaar-pi-report
            target/x86_64-apple-darwin/release/yaar-review
            target/x86_64-apple-darwin/release/yaar-keeper
            target/x86_64-apple-darwin/release/yaar-claude-hook
            target/x86_64-apple-darwin/release/yaar-claude-tools
            target/x86_64-apple-darwin/release/yaar-pi-report
            dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-test-programs
          path: |
            target/debug/standin-agent
            target/debug/yaar-script
          if-no-files-found: error

  package-linux:
    name: package linux ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The oldest promised release: a program built on a newer one does not start on an older one.
    container: ubuntu:22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc g++ libc6-dev pkg-config libfontconfig-dev \
            libxkbcommon-x11-dev dpkg-dev file binutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain named in rust-toolchain.toml
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/rustc" -vV

      - name: Restore crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: package-crates-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            package-crates-${{ runner.os }}-${{ matrix.arch }}-

      - name: Restore build output
        if: needs.version.outputs.publish != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: package-${{ runner.os }}-${{ matrix.arch }}-ubuntu22.04-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            package-${{ runner.os }}-${{ matrix.arch }}-ubuntu22.04-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Notices tool
        run: .github/scripts/install-tools.sh "$HOME/.cargo/bin" about

      - name: Fetch crates
        run: cargo fetch --locked

      - name: Release build
        run: .github/scripts/release-build.sh

      - name: Third-party notices
        run: packaging/notices.sh dist/THIRD-PARTY-NOTICES.txt ${{ matrix.arch }}-unknown-linux-gnu

      - name: The .deb and the archive
        run: |
          NOTICES=dist/THIRD-PARTY-NOTICES.txt packaging/package-linux.sh \
            target/release "$VERSION" dist

      - name: Package check
        run: .github/scripts/linux-package-check.sh dist "$VERSION" dist/THIRD-PARTY-NOTICES.txt

      - name: The programs the install job drives the app with
        run: cargo build --locked -p yaar-system-tests --bins

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-programs-linux-${{ matrix.arch }}
          path: |
            target/debug/standin-agent
            target/debug/yaar-script
          if-no-files-found: error

  assemble:
    name: assemble
    needs: [version, macos, package-linux]
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LATER: ${{ needs.version.outputs.later }}
    steps:
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git dpkg-dev apt-utils gnupg jq unzip xz-utils python3 procps

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The install jobs rest on these two scripts. They are checked here, in a job that has what
      # they need and runs before the install jobs, so a fault shows once, not in every install job.
      - name: The stand-in server answers at once, ends a start that fails, and never answers 304
        run: .github/scripts/serve-site-check.sh

      - name: The archive route of the install line finds, checks and refuses on both processors
        run: .github/scripts/install-archive-check.sh

      # cargo reads the lock file to count what each package links; nothing is compiled.
      - name: Rust toolchain named in rust-toolchain.toml
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/rustc" -vV

      - name: Fetch crates
        run: cargo fetch --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: packages
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-universal
          path: packages

      - name: The notices count every linked dependency of the lock file
        run: packaging/notices-count.sh packages

      - name: The count of the notices can fail
        run: .github/scripts/notices-can-fail.sh packages

      # The project's key is a secret of the environment `release`, which only assemble-release
      # may name.
      - name: The release files, the site and the apt repository, signed with a throwaway key
        run: |
          eval "$(packaging/apt/make-test-key.sh)"
          export GNUPGHOME YAAR_APT_KEY
          packaging/release/assemble.sh "$VERSION" packages rehearsal
          packaging/release/later.sh rehearsal "$LATER"
          gpgconf --homedir "$GNUPGHOME" --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

      - name: One checksum file lists every package of the release
        run: .github/scripts/release-files-check.sh rehearsal/release "$VERSION"

      - name: The texts name the one base address
        run: .github/scripts/base-url-check.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal
          path: rehearsal/
          if-no-files-found: error

  install-linux:
    name: install ${{ matrix.image }} ${{ matrix.arch }}
    needs: [version, assemble]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    container: ${{ matrix.image }}
    timeout-minutes: 20
    env:
      LATER: ${{ needs.version.outputs.later }}
    steps:
      - name: What a user's system has, and a user
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl sudo python3 procps
          useradd --create-home tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rehearsal
          path: rehearsal

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-programs-linux-${{ matrix.arch }}
          path: test-programs

      # git makes the repository and leaves again, so that the package's dependency on git is
      # still what brings it.
      - name: The user's own files, before anything of the app
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git
          .github/scripts/user-files.sh plant tester
          DEBIAN_FRONTEND=noninteractive apt-get purge -y git

      - name: Serve the site as GitHub Pages would
        run: |
          .github/scripts/serve-site.sh start rehearsal/site rehearsal/release 8000
          .github/scripts/user-files.sh snapshot tester "$RUNNER_TEMP/user-files-before"

      - name: apt refuses the repository when its index or a package was changed after signing
        run: .github/scripts/linux-tampered.sh rehearsal

      # The archive route is the one that reads SHA256SUMS on Linux.
      - name: The install line refuses a download that does not match SHA256SUMS
        run: .github/scripts/install-wrong-sum.sh rehearsal tester

      - name: The install line, as a user
        run: |
          sudo -u tester env YAAR_BASE_URL=http://127.0.0.1:8000 \
            YAAR_DOWNLOAD_URL=http://127.0.0.1:8000/download \
            bash -c 'curl -fsSL "$YAAR_BASE_URL/install.sh" | bash'
          dpkg-query -W yaar-review
          apt-cache policy yaar-review

      - name: The programs run, and the Keeper outlives the Window program
        run: |
          yaar-review --version
          sudo -u tester bash -c '
            set -euo pipefail
            first=$(yaar-review --keeper-status); echo "$first"
            second=$(yaar-review --keeper-status); echo "$second"
            case "$first" in *"started=true"*) ;; *) echo "the first call did not start a Keeper"; exit 1 ;; esac
            case "$second" in *"started=false"*) ;; *) echo "the second call started another Keeper"; exit 1 ;; esac
            pid=$(printf "%s\n" "$first" | tr " " "\n" | sed -n "s/^pid=//p")
            session=$(printf "%s\n" "$first" | tr " " "\n" | sed -n "s/^session=//p")
            [ "$pid" = "$session" ] || { echo "the Keeper does not lead its own session"; exit 1; }
            readlink "/proc/$pid/exe"
            [ "$(readlink "/proc/$pid/exe")" = /usr/libexec/yaar-review/yaar-keeper ]
          '

      - name: The app starts from the app menu with no terminal
        run: .github/scripts/linux-launch.sh tester

      - name: From the app the system started, a worktree is made with an agent, and its hook finds a program of the login path
        run: .github/scripts/linux-login-path.sh tester test-programs

      # linux-upgrade.sh leaves the later site served: the steps below run against it.
      - name: A later version arrives with apt-get upgrade
        run: .github/scripts/linux-upgrade.sh tester rehearsal/site-later "$LATER"

      - name: The app's own files are there before the uninstall
        run: .github/scripts/user-files.sh present tester

      - name: A second run changes nothing, and the uninstall leaves nothing
        run: |
          state() {
            dpkg-query -W -f='${Version} ${db:Status-Abbrev}\n' yaar-review
            md5sum /var/lib/dpkg/info/yaar-review.list /etc/apt/keyrings/yaar-review.asc \
              /etc/apt/sources.list.d/yaar-review.sources
            ls -la --time-style=+%s /etc/apt/keyrings /etc/apt/sources.list.d
          }
          state > "$RUNNER_TEMP/second-run-before"
          sudo -u tester env YAAR_BASE_URL=http://127.0.0.1:8000 \
            YAAR_DOWNLOAD_URL=http://127.0.0.1:8000/download \
            bash -c 'curl -fsSL "$YAAR_BASE_URL/install.sh" | bash'
          state > "$RUNNER_TEMP/second-run-after"
          diff "$RUNNER_TEMP/second-run-before" "$RUNNER_TEMP/second-run-after"
          sudo -u tester env YAAR_BASE_URL=http://127.0.0.1:8000 \
            bash -c 'curl -fsSL "$YAAR_BASE_URL/install.sh" | bash -s -- --uninstall'
          # A `!` in front of a command never stops a step that runs under `bash -e`, so each check
          # is an `if` that says what it found.
          if command -v yaar-review; then
            echo 'yaar-review is still on the path after the uninstall' >&2
            exit 1
          fi
          if [ "$(dpkg-query -W -f='${db:Status-Abbrev}' yaar-review 2> /dev/null)" = 'ii ' ]; then
            echo 'the package yaar-review is still installed after the uninstall' >&2
            exit 1
          fi
          if [ -e /etc/apt/sources.list.d/yaar-review.sources ]; then
            echo '/etc/apt/sources.list.d/yaar-review.sources is still there after the uninstall' >&2
            exit 1
          fi
          if [ -e /etc/apt/keyrings/yaar-review.asc ]; then
            echo '/etc/apt/keyrings/yaar-review.asc is still there after the uninstall' >&2
            exit 1
          fi

      - name: No file of the app is left in the user's folders
        run: .github/scripts/user-files.sh check tester "$RUNNER_TEMP/user-files-before"

  install-macos:
    name: install macos
    needs: [version, macos, assemble]
    runs-on: macos-26
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rehearsal
          path: rehearsal

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-test-programs
          path: test-programs

      - name: The user's own files, before anything of the app
        run: .github/scripts/user-files.sh plant "$(id -un)"

      - name: Serve the site as GitHub Pages would
        run: |
          .github/scripts/serve-site.sh start rehearsal/site rehearsal/release 8000
          .github/scripts/user-files.sh snapshot "$(id -un)" "$RUNNER_TEMP/user-files-before"

      - name: The install line refuses a download that does not match SHA256SUMS
        run: .github/scripts/install-wrong-sum.sh rehearsal

      - name: The install line installs the app on macOS
        run: .github/scripts/macos-install.sh install

      - name: The app starts from the Dock with no terminal
        run: .github/scripts/macos-launch.sh

      - name: From the app the system started, a worktree is made with an agent, and its hook finds a program of the login path
        run: .github/scripts/macos-login-path.sh test-programs

      - name: The app's own files are there before the uninstall
        run: .github/scripts/user-files.sh present "$(id -un)"

      - name: The uninstall removes the app
        run: .github/scripts/macos-install.sh uninstall

      - name: No file of the app is left in the user's folders
        run: .github/scripts/user-files.sh check "$(id -un)" "$RUNNER_TEMP/user-files-before"

  # The three jobs below run only on a publishing run. Their secrets live in the environments
  # `release` and `github-pages`, which the owner limits to the tags v*.

  release-sign-macos:
    name: release sign macos
    needs: [version, macos]
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-programs
          path: programs

      - name: A keychain of this job's own, with the Developer ID and the notary key
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: .github/scripts/macos-keychain.sh import

      - name: The app, the .zip and the disk image, signed with the Developer ID and notarised
        run: |
          NOTICES=programs/dist/THIRD-PARTY-NOTICES.txt packaging/package-macos.sh "$VERSION" signed \
            programs/target/aarch64-apple-darwin/release programs/target/x86_64-apple-darwin/release

      - name: What the Mac bundle holds
        run: |
          .github/scripts/macos-bundle-check.sh signed/YAAR.app "$VERSION" \
            programs/dist/THIRD-PARTY-NOTICES.txt signed

      - name: Gatekeeper accepts the notarized disk image and the app
        run: .github/scripts/gatekeeper-check.sh signed "$VERSION"

      - name: The keychain and the notary key are removed
        if: always()
        run: .github/scripts/macos-keychain.sh remove

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: |
            signed/*.dmg
            signed/*.zip
          if-no-files-found: error

  assemble-release:
    name: assemble release
    needs: [version, package-linux, release-sign-macos]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: System packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            dpkg-dev apt-utils gnupg jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: packages
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release
          path: packages

      - name: The project's key, checked against the fingerprint in the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: .github/scripts/project-key.sh import

      - name: The packages already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-published-debs.sh previous

      - name: The release files, the site and the apt repository, signed with the project's key
        run: |
          PREVIOUS=previous packaging/release/assemble.sh "$VERSION" packages final

      - name: One checksum file lists every package of the release
        run: .github/scripts/release-files-check.sh final/release "$VERSION"

      - name: The index and the checksums verify with the key the site publishes
        run: .github/scripts/verify-signed.sh final

      - name: The project's key is removed
        if: always()
        run: .github/scripts/project-key.sh remove

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-final
          path: final/
          if-no-files-found: error

  # On a first release, a failure between the Pages deployment and the release made the latest
  # leaves apt answering and the macOS and archive routes failing: re-run this job alone.
  publish:
    name: publish
    needs: [version, checks-linux, macos, install-linux, install-macos, assemble-release]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history: the notes of the release are the commits since the tag before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-final
          path: final

      - name: A draft release with every file
        run: .github/scripts/publish.sh draft final/release "$VERSION"

      # Another run may have published a greater version meanwhile: then this one is published, not as
      # the latest, and leaves the site as it is.
      - name: Whether a published release has a greater version
        id: latest
        run: .github/scripts/publish.sh latest final/release "$VERSION"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.latest.outputs.latest == 'true'
        with:
          path: final/site

      - name: The site, deployed
        id: deployment
        if: steps.latest.outputs.latest == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: The release, published, as the latest when no published release has a greater version
        env:
          YAAR_LATEST: ${{ steps.latest.outputs.latest }}
        run: .github/scripts/publish.sh publish final/release "$VERSION"

      - name: The release is tagged on the public repository, and its source holds the licence
        env:
          YAAR_LATEST: ${{ steps.latest.outputs.latest }}
        run: .github/scripts/publish.sh check final/release "$VERSION"

  # After a push to main whose every job passed. No secret: the workflow's own token pushes, and a
  # run started by workflow_dispatch is the one run that token may start.
  release:
    name: release
    needs: [version, checks-linux, macos, package-linux, assemble, install-linux, install-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    timeout-minutes: 10
    env:
      RELEASES: ${{ vars.RELEASES }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The whole history, and the token kept: the job pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The next version from the commit messages, released when RELEASES is on
        run: packaging/release/release.sh
