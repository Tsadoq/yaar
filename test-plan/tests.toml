# The test plan of YAAR: every test, the requirements it proves, and how it reaches the app.
# `cargo xtask coverage` checks this file against requirements.toml and slices.toml.
#
#   level      unit: one module through its public functions
#              component: one part through the surface the rest of the app uses, with the real things beneath it
#              system: the whole app through what a user or an agent touches
#   through    the surface the test goes through
#   driver     what drives it; the list is in xtask/src/coverage.rs
#   runs       ci: on every change.  release: before a release, by the checklist named
#   built      where the test is, once it exists: `file::test function` or `workflow file::step name`
#
# A test reaches a part only through its surface. It reads no private state and replaces
# none of the app's own parts. Stand-ins exist only at the edges: the agent CLI, the language server.
#
# A pane test fills the shared models with facts as the Keeper sends them and reads the requests the
# pane makes. It asserts nothing that only the Keeper can produce: that is for the tests of the whole
# Window (part = window), which have a real Keeper beneath, and for the system tests.
#
# A row with driver = agent runs twice, once with the stand-in speaking as Claude Code and once as pi,
# through the same contract. A row that runs for one only says why in its note.
#
# One requirement often has a row at more than one level. Each catches a different fault: the rule is
# wrong (unit), the part does not show or ask for it (component), the parts are not joined (system).

[[test]]
id = "LINK-01"
what = "A frame comes back as it was sent, fields a later version appended are read, two frames in a row are read one by one, and what is not a frame is refused."
level = "unit"
part = "link"
through = "its public functions"
driver = "call"
runs = "ci"
proves = []
slice = 0
built = [
    "crates/shared/link/src/lib.rs::a_hello_comes_back_as_it_was_sent",
    "crates/shared/link/src/lib.rs::a_hello_with_fields_appended_by_a_later_version_is_read",
    "crates/shared/link/src/lib.rs::two_frames_in_a_row_are_read_one_by_one_and_then_the_end_is_closed",
    "crates/shared/link/src/lib.rs::what_is_not_a_frame_is_refused",
]

