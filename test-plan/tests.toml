[[test]]
id = "ACT-01"
what = "For every request of the Link that a user starts, the composed Window has an action with a key, and running the action sends that request. The test walks the list, so a request with no control, or a control with no key, fails."
level = "component"
part = "window"
through = "keys in, with a real Keeper beneath; read back as the requests that reach it"
driver = "test-platform"
runs = "ci"
proves = ["FR-121", "FR-003", "FR-014", "FR-076", "FR-078", "FR-080", "FR-087", "FR-101", "FR-107", "FR-109", "FR-120"]
built = [
    "crates/window/window/tests/actions.rs::every_request_a_user_starts_has_a_control_whose_key_sends_it",
    "crates/window/window/tests/actions.rs::no_key_of_a_control_that_names_no_message_sends_what_a_user_starts",
]
note = "The walk is over the kinds of request of the Link. Who starts a kind is declared in the Link's own table, which a reviewer checks. The request that stops everything joins the walk when its control is built. Opening a terminal is the user's; telling a terminal's size is the Window's."

