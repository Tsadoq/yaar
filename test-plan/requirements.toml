# The requirements of YAAR, one sentence each. Generated: do not edit by hand.
# `cargo xtask coverage` fails when one of them has no test in tests.toml.
# R1 is the first release; Later is wanted after it; a withdrawn id is never used again.

version = "v1.6"

[[requirement]]
id = "FR-001"
release = "R1"
section = "Workspaces and the sidebar"
text = "The app shall show, for each workspace, the changes of its branch since its base."

[[requirement]]
id = "FR-002"
release = "R1"
section = "Workspaces and the sidebar"
text = "Unless the user set another base or the app created the worktree, the base of a workspace shall be the default branch of its repository, and the app shall count the changes from the point where the branch of the workspace left it."

[[requirement]]
id = "FR-003"
release = "R1"
section = "Workspaces and the sidebar"
text = "The app shall let the user set the base of a workspace to any branch or commit."

[[requirement]]
id = "FR-004"
release = "R1"
section = "Workspaces and the sidebar"
text = "A worktree the app created shall have as its base the branch it was made from."

[[requirement]]
id = "FR-005"
release = "R1"
section = "Workspaces and the sidebar"
text = "While a workspace is on its base branch, the app shall show the commits that are not on the upstream of that branch and the uncommitted changes."

[[requirement]]
id = "FR-006"
release = "R1"
section = "Workspaces and the sidebar"
text = "The sidebar shall list each repository with its worktrees under it, each named by its branch."

[[requirement]]
id = "FR-007"
release = "R1"
section = "Workspaces and the sidebar"
text = "The sidebar shall show for each workspace whether its agent works, waits for the user's permission, has finished a turn that is not yet reviewed, or is not running."

[[requirement]]
id = "FR-008"
release = "R1"
section = "Workspaces and the sidebar"
text = "For a workspace with several agents the sidebar shall show the first of these states that holds for any of them: waits for the user's permission, has finished a turn that is not yet reviewed, works, is not running."

[[requirement]]
id = "FR-009"
release = "R1"
section = "Workspaces and the sidebar"
text = "While the window is narrower than a set width and the user has pinned neither form, the sidebar shall show as a rail."

[[requirement]]
id = "FR-010"
release = "R1"
section = "Workspaces and the sidebar"
text = "The app shall offer a control that pins the sidebar as a rail or as the full list, whatever the width of the window."

[[requirement]]
id = "FR-011"
release = "R1"
section = "Workspaces and the sidebar"
text = "When the user selects a workspace, the app shall show the reviews and the terminals of that worktree together."

[[requirement]]
id = "FR-012"
release = "R1"
section = "Workspaces and the sidebar"
text = "When an agent finishes a turn in a workspace that is not on screen, the app shall change the state of that workspace in the sidebar and show a notice with a control that switches to it."

[[requirement]]
id = "FR-013"
release = "R1"
section = "Workspaces and the sidebar"
text = "The app shall let the user add a workspace by opening a folder that holds a git repository or worktree."

[[requirement]]
id = "FR-014"
release = "R1"
section = "Workspaces and the sidebar"
text = "The app shall let the user create a git worktree from a branch name and start an agent in it, in one step."

[[requirement]]
id = "FR-015"
release = "R1"
section = "The terminal pane and the agents"
text = "The terminal pane shall sit to the right of the review pane by default."

[[requirement]]
id = "FR-016"
release = "R1"
section = "The terminal pane and the agents"
text = "The app shall let the user move the terminal pane to the left of the review pane or below it, and to no other place."

[[requirement]]
id = "FR-017"
release = "R1"
section = "The terminal pane and the agents"
text = "The terminal pane shall hold several terminals at once, each running an agent CLI or a shell."

[[requirement]]
id = "FR-018"
release = "R1"
section = "The terminal pane and the agents"
text = "The app shall run the official agent CLI unmodified in the terminal pane, and shall add its own pieces only through the extension points of that CLI."

[[requirement]]
id = "FR-019"
release = "R1"
section = "The terminal pane and the agents"
text = "In the first release the app shall offer no interface of its own for talking to the agent: the user talks to the agent in its terminal."

[[requirement]]
id = "FR-020"
release = "R1"
section = "The terminal pane and the agents"
text = "The app shall offer a split view of the terminal pane that shows two terminals at once."

[[requirement]]
id = "FR-021"
release = "R1"
section = "The terminal pane and the agents"
text = "The app shall offer a launcher for each supported agent CLI next to the shell."

[[requirement]]
id = "FR-022"
release = "R1"
section = "The terminal pane and the agents"
text = "An agent CLI the user starts by typing its name in a shell of the app shall get everything one started from its launcher gets."

[[requirement]]
id = "FR-023"
release = "R1"
section = "The terminal pane and the agents"
text = "Every requirement that names an agent shall hold for Claude Code and for pi."

[[requirement]]
id = "FR-024"
release = "R1"
section = "The terminal pane and the agents"
text = "The app shall run an agent CLI other than Claude Code and pi in the terminal pane as it runs any program."

[[requirement]]
id = "FR-025"
release = "R1"
section = "The terminal pane and the agents"
text = "A change made by an agent CLI other than Claude Code and pi shall count as a change that no agent made."

[[requirement]]
id = "FR-026"
release = "R1"
section = "The terminal pane and the agents"
text = "For an agent CLI other than Claude Code and pi the app shall show no turns, no follow, no notice of a finished turn and no replies, and shall attach no review to its messages."

[[requirement]]
id = "FR-027"
release = "R1"
section = "The terminal pane and the agents"
text = "While an agent waits at a permission prompt, the app shall show that state in the sidebar and on the agent's terminal."

[[requirement]]
id = "FR-028"
release = "R1"
section = "The terminal pane and the agents"
text = "The app shall never answer for the user a permission prompt or any other dialog of an agent CLI, the trust dialog of a new folder included."

[[requirement]]
id = "FR-029"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "The review pane shall offer a Flow view of what the agent does as it works and a Changes view of a change the reviewer selects."

[[requirement]]
id = "FR-030"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "Flow shall have two forms: a timeline of the agent's steps, each edit, read and command in order, and a live diff of the running turn."

[[requirement]]
id = "FR-031"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "The app shall let the user switch between the two forms of Flow at any time."

[[requirement]]
id = "FR-032"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "Flow shall open as the timeline the first time and afterwards in the form the user chose last."

[[requirement]]
id = "FR-033"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "The app shall offer a control that turns follow on and off, and follow shall be on until the user turns it off."

[[requirement]]
id = "FR-034"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "While follow is on and the agent works, Flow shall move to each step of the agent as it happens."

[[requirement]]
id = "FR-035"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "While follow is on, Flow shall move to a file the agent reads as it does to a file the agent writes."

[[requirement]]
id = "FR-036"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "When the reviewer scrolls, clicks or types in the review pane while follow is on, follow shall pause, count the steps the reviewer misses, and offer to resume."

[[requirement]]
id = "FR-037"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "When the user sends a message to the agent while follow is on, the review pane shall switch to Flow."

[[requirement]]
id = "FR-038"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "When a turn ends while Flow is on screen, the review pane shall stay in Flow and offer to open in Changes what changed since the reviewer's last review."

[[requirement]]
id = "FR-039"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "Follow shall move Flow only, and the app shall never scroll Changes by itself."

[[requirement]]
id = "FR-040"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "The first release shall not use the editor connection of Claude Code."

[[requirement]]
id = "FR-041"
release = "R1"
section = "Watching the agent: Flow and follow"
text = "The app shall let the reviewer draft comments in Flow, and shall show such a draft on its line in Changes."

[[requirement]]
id = "FR-127"
release = "Later"
section = "Watching the agent: Flow and follow"
text = "While several agents work in one worktree, Flow shall show for each a marker with its name at the place it is changing, and a marker named shell for a change made through a shell command."

[[requirement]]
id = "FR-042"
release = "R1"
section = "Choosing what to review"
text = "Changes shall show a tree with the history of the worktree, its commits and the agent's turns, and the files of the selected change."

[[requirement]]
id = "FR-043"
release = "R1"
section = "Choosing what to review"
text = "The app shall let the reviewer select one commit, one turn, or a range of them as the change to review."

[[requirement]]
id = "FR-044"
release = "R1"
section = "Choosing what to review"
text = "The app shall let the reviewer switch a diff between a unified and a split view."

[[requirement]]
id = "FR-045"
release = "R1"
section = "Choosing what to review"
text = "The app shall let the reviewer mark a file as viewed, and shall clear the mark when the file changes."

[[requirement]]
id = "FR-046"
release = "R1"
section = "Choosing what to review"
text = "The app shall record the state of the worktree at the end of each agent turn and at each send of a review, without making a git commit."

[[requirement]]
id = "FR-125"
release = "R1"
section = "Choosing what to review"
text = "The app shall delete the recorded state of a turn that no thread, no round and no reviewed mark refers to once a set time has passed since the turn, 30 days unless the user changes it, except the newest recorded state of a worktree that still exists, and shall keep the turn in the history, marked as expired."

[[requirement]]
id = "FR-047"
release = "R1"
section = "Choosing what to review"
text = "When a turn ends, the app shall select in Changes what changed since the reviewer's last review, unless the user has set the app to keep the selection."

[[requirement]]
id = "FR-048"
release = "R1"
section = "Choosing what to review"
text = "When a turn ends while the app is set to keep the selection, the app shall leave Changes as it is and offer what changed since the reviewer's last review."

[[requirement]]
id = "FR-049"
release = "R1"
section = "Choosing what to review"
text = "A change that no agent made shall show under uncommitted changes, while it is uncommitted, in every review of that worktree."

[[requirement]]
id = "FR-050"
release = "R1"
section = "Choosing what to review"
text = "A comment on a change that no agent made shall belong to the review the user is in."

[[requirement]]
id = "FR-051"
release = "R1"
section = "Code intelligence in the diff"
text = "When the reviewer hovers a name in a diff, the app shall show what the language server reports for it."

[[requirement]]
id = "FR-052"
release = "R1"
section = "Code intelligence in the diff"
text = "When the reviewer goes to the definition of a name in a diff, the app shall open the target in a read-only file view and offer a control that returns the reviewer to the place in the diff they left."

[[requirement]]
id = "FR-053"
release = "R1"
section = "Code intelligence in the diff"
text = "The first release shall show the content of files read-only and shall offer no way to edit them."

[[requirement]]
id = "FR-054"
release = "R1"
section = "Code intelligence in the diff"
text = "The app shall let the reviewer list the references to a name in a diff and open any of them."

[[requirement]]
id = "FR-055"
release = "R1"
section = "Code intelligence in the diff"
text = "On a removed line, in the unified and in the split view, hover and go to definition shall answer from the old version of the code."

[[requirement]]
id = "FR-056"
release = "R1"
section = "Code intelligence in the diff"
text = "The app shall provide code intelligence for TypeScript and JavaScript, Python and Rust, and for no other language of its own."

[[requirement]]
id = "FR-057"
release = "R1"
section = "Code intelligence in the diff"
text = "If the app finds no language server for a language it supports, then it shall say so and offer to download one into its own folder."

[[requirement]]
id = "FR-058"
release = "R1"
section = "Code intelligence in the diff"
text = "When the user accepts the offer, the app shall download the language server and start it."

[[requirement]]
id = "FR-059"
release = "R1"
section = "Code intelligence in the diff"
text = "The notice of a missing language server shall be a line that stays in the review pane and not a dialog."

[[requirement]]
id = "FR-060"
release = "R1"
section = "Code intelligence in the diff"
text = "When several language servers are available for a language, the app shall use the first of these: the one the user registered, the project's own, one installed on the machine, one the app downloaded."

[[requirement]]
id = "FR-061"
release = "R1"
section = "Code intelligence in the diff"
text = "If a language server fails to start, then the app shall pass over it and try the next one."

[[requirement]]
id = "FR-062"
release = "R1"
section = "Code intelligence in the diff"
text = "Before it first runs a language server that sits inside a repository, the app shall ask the user, once per repository."

[[requirement]]
id = "FR-063"
release = "R1"
section = "Code intelligence in the diff"
text = "The app shall update a language server it downloaded only when the user asks."

[[requirement]]
id = "FR-064"
release = "R1"
section = "Code intelligence in the diff"
text = "The app shall run the language servers of the workspace on screen."

[[requirement]]
id = "FR-065"
release = "R1"
section = "Code intelligence in the diff"
text = "When a workspace has been off screen for a set time, 10 minutes unless the user changes it, the app shall stop the language servers of that workspace."

[[requirement]]
id = "FR-066"
release = "R1"
section = "Code intelligence in the diff"
text = "The app shall start the language server for the old version of the code the first time the reviewer uses it, and shall stop it by the same rule."

[[requirement]]
id = "FR-067"
release = "R1"
section = "Code intelligence in the diff"
text = "The app shall show whether the language server for the code on screen is ready, starting or missing."

[[requirement]]
id = "FR-068"
release = "R1"
section = "Code intelligence in the diff"
text = "While no language server is ready for a file, the app shall resolve names by text match and mark every such answer as possibly wrong."

[[requirement]]
id = "FR-069"
release = "R1"
section = "Code intelligence in the diff"
text = "The app shall let the user name, per language, the command of a language server, and shall start and use that server."

[[requirement]]
id = "FR-070"
release = "R1"
section = "Code intelligence in the diff"
text = "The app shall show the state of a language server the user registered as it shows that of a built-in one; what such a server answers is outside the promises of this note."

[[requirement]]
id = "FR-071"
release = "R1"
section = "Code intelligence in the diff"
text = "The registry of language servers shall be one file per user in the app's own folder."

[[requirement]]
id = "FR-072"
release = "Later"
section = "Code intelligence in the diff"
text = "The app shall offer a settings screen for the registry of language servers."

[[requirement]]
id = "FR-073"
release = "R1"
section = "Code intelligence in the diff"
text = "The app shall never download a language server the user registered."

[[requirement]]
id = "FR-074"
release = "R1"
section = "Comments"
text = "The app shall let the reviewer comment on any line of a diff, removed lines included."

[[requirement]]
id = "FR-075"
release = "R1"
section = "Comments"
text = "The app shall let the reviewer comment on any line reached through go to definition or a reference, whether or not the line is part of the diff."

[[requirement]]
id = "FR-076"
release = "R1"
section = "Comments"
text = "A comment shall be a draft until it is sent, and the reviewer shall be able to edit and delete a draft."

[[requirement]]
id = "FR-077"
release = "R1"
section = "Comments"
text = "A sent comment shall carry the number of its round and shall not be editable."

[[requirement]]
id = "FR-078"
release = "R1"
section = "Comments"
text = "The app shall let the reviewer follow up on a sent comment with a reply in the same thread."

[[requirement]]
id = "FR-079"
release = "R1"
section = "Comments"
text = "The app shall let the reviewer copy as text every unsent comment on an unresolved thread of a review, to paste it by hand to an agent the app cannot deliver to."

[[requirement]]
id = "FR-080"
release = "R1"
section = "Sending a review to the agent"
text = "When the reviewer attaches a review, the app shall attach every unsent comment on an unresolved thread of that review to the user's next message to its agent."

[[requirement]]
id = "FR-081"
release = "R1"
section = "Sending a review to the agent"
text = "While a review is attached, the app shall show the attachment at the agent's terminal, with a control to view what will be sent and a control to detach it."

[[requirement]]
id = "FR-082"
release = "R1"
section = "Sending a review to the agent"
text = "The app shall deliver a review to the agent completely, whatever its length."

[[requirement]]
id = "FR-083"
release = "R1"
section = "Sending a review to the agent"
text = "While a review is attached, the reviewer shall be able to edit its comments, and a new draft shall join the attachment, except when one thread is attached alone."

[[requirement]]
id = "FR-084"
release = "R1"
section = "Sending a review to the agent"
text = "A resolved thread shall not be sent again, an unsent comment on it included."

[[requirement]]
id = "FR-085"
release = "R1"
section = "Sending a review to the agent"
text = "The app shall never submit a message to the agent: the user presses Enter."

[[requirement]]
id = "FR-086"
release = "R1"
section = "Sending a review to the agent"
text = "When the user submits the message that carries a review, the app shall mark the attached comments as sent and start a new round."

[[requirement]]
id = "FR-087"
release = "R1"
section = "Sending a review to the agent"
text = "The app shall let the reviewer attach one thread alone, and such a send shall count as a round."

[[requirement]]
id = "FR-088"
release = "R1"
section = "Sending a review to the agent"
text = "When the reviewer copies a review as text, the app shall mark the copied comments as sent and start a new round, as it does when the user submits a review."

[[requirement]]
id = "FR-089"
release = "R1"
section = "Sending a review to the agent"
text = "The app shall write nothing at the agent's prompt except the sentence its one-click control types: the user words the request there."

[[requirement]]
id = "FR-090"
release = "R1"
section = "Sending a review to the agent"
text = "The instruction on how to answer each thread shall travel with the comments, whatever the user writes."

[[requirement]]
id = "FR-091"
release = "R1"
section = "Sending a review to the agent"
text = "While a review is attached and the agent shows no permission prompt or other dialog, the app shall offer one control that types \"Address each comment.\" at the agent's prompt for the user to submit."

[[requirement]]
id = "FR-092"
release = "R1"
section = "Sending a review to the agent"
text = "The app shall deliver a review only to the agent whose session it belongs to."

[[requirement]]
id = "FR-093"
release = "R1"
section = "Sending a review to the agent"
text = "While the agent works, the app shall let the user attach a review and submit a message, and the review shall go with that message as the agent CLI queues it."

[[requirement]]
id = "FR-094"
release = "R1"
section = "Sending a review to the agent"
text = "If the reviewer attaches a review whose agent is not running, then the app shall offer to start that agent CLI in the workspace, whether or not another agent runs there, with the review attached to its first message."

[[requirement]]
id = "FR-095"
release = "R1"
section = "Sending a review to the agent"
text = "If the reviewer attaches the review that belongs to no agent, then the app shall offer to start Claude Code or pi with the review attached to its first message."

[[requirement]]
id = "FR-096"
release = "R1"
section = "Sending a review to the agent"
text = "While an agent waits at a permission prompt, the app shall let the reviewer attach a review, and an attached review shall stay attached and go with the user's next message, not with the answer to the prompt."

[[requirement]]
id = "FR-097"
release = "R1"
section = "Rounds, replies and resolution"
text = "The app shall let the agent reply to each thread and mark a thread as addressed."

[[requirement]]
id = "FR-098"
release = "R1"
section = "Rounds, replies and resolution"
text = "Only the reviewer shall be able to resolve a thread."

[[requirement]]
id = "FR-099"
release = "R1"
section = "Rounds, replies and resolution"
text = "A thread the agent replied to without marking it addressed shall stay open and show that it waits for the reviewer's answer."

[[requirement]]
id = "FR-100"
release = "R1"
section = "Rounds, replies and resolution"
text = "The review pane shall list all threads with their state: draft, sent, addressed, waiting for the reviewer, resolved."

[[requirement]]
id = "FR-101"
release = "R1"
section = "Rounds, replies and resolution"
text = "The app shall let the reviewer reopen a resolved thread and resolve all addressed threads at once."

[[requirement]]
id = "FR-102"
release = "R1"
section = "Rounds, replies and resolution"
text = "After a send, the review pane shall keep showing the round as sent until the agent's first edit."

[[requirement]]
id = "FR-103"
release = "R1"
section = "Rounds, replies and resolution"
text = "For each round the app shall show what changed since the comments of that round were sent."

[[requirement]]
id = "FR-104"
release = "R1"
section = "Rounds, replies and resolution"
text = "A review shall have no votes and no labels."

[[requirement]]
id = "FR-105"
release = "R1"
section = "Rounds, replies and resolution"
text = "When the agent rewrites or deletes the line a thread sits on, the app shall move the thread to the code that replaced it, say that the code changed, and let the reviewer see the line the comment was written on."

[[requirement]]
id = "FR-106"
release = "R1"
section = "Rounds, replies and resolution"
text = "A thread whose line only moved shall follow it without a notice."

[[requirement]]
id = "FR-107"
release = "R1"
section = "Marking reviewed and committing"
text = "When the reviewer marks a change reviewed, the app shall record the current state as reviewed and start the next review from it, without making a commit."

[[requirement]]
id = "FR-108"
release = "R1"
section = "Marking reviewed and committing"
text = "Every requirement on reviews shall hold in a worktree in which nobody commits."

[[requirement]]
id = "FR-109"
release = "R1"
section = "Marking reviewed and committing"
text = "The app shall offer an optional commit control with a message field, and shall make with it an ordinary git commit of every uncommitted change of the worktree."

[[requirement]]
id = "FR-110"
release = "R1"
section = "Marking reviewed and committing"
text = "A commit made through the app shall mark nothing reviewed and shall leave unchanged what counts as changed since the last review."

[[requirement]]
id = "FR-111"
release = "R1"
section = "Sessions, quitting and restarting"
text = "Except for the review with no agent, a review shall belong to one agent session, and two agents in one worktree shall have a review each."

[[requirement]]
id = "FR-112"
release = "R1"
section = "Sessions, quitting and restarting"
text = "With one agent session in a worktree the review pane shall name it; with several it shall let the reviewer choose whose review to show."

[[requirement]]
id = "FR-113"
release = "R1"
section = "Sessions, quitting and restarting"
text = "A workspace that holds no review of a Claude Code or pi session shall have one review that belongs to no agent."

[[requirement]]
id = "FR-114"
release = "R1"
section = "Sessions, quitting and restarting"
text = "When the user starts Claude Code or pi in such a workspace, from the offer made on attaching, a launcher or a shell, the first such session shall take the review over."

[[requirement]]
id = "FR-115"
release = "R1"
section = "Sessions, quitting and restarting"
text = "When an agent session ends, its review shall stay open, and the next session of that agent in that worktree shall take it over."

[[requirement]]
id = "FR-116"
release = "R1"
section = "Sessions, quitting and restarting"
text = "When the user quits the app the plain way, the agents shall keep running."

[[requirement]]
id = "FR-117"
release = "R1"
section = "Sessions, quitting and restarting"
text = "When the user reopens the app, it shall show every review and every agent as they are, including the turns that ended while it was closed."

[[requirement]]
id = "FR-118"
release = "R1"
section = "Sessions, quitting and restarting"
text = "The app shall offer a second way to quit that also stops the agents, and plain quit shall be the default."

[[requirement]]
id = "FR-119"
release = "R1"
section = "Sessions, quitting and restarting"
text = "After a restart of the machine the app shall show every review as it was left, with its threads, drafts, rounds, turns and attachment."

[[requirement]]
id = "FR-120"
release = "R1"
section = "Sessions, quitting and restarting"
text = "After a restart of the machine the app shall offer, for each agent that was running, a control that resumes its session with the agent CLI's own command for bringing a session back."

[[requirement]]
id = "FR-121"
release = "R1"
section = "Keyboard"
text = "The app shall let the reviewer do every review action from the keyboard."

[[requirement]]
id = "FR-122"
release = "R1"
section = "Keyboard"
text = "The app shall keep a small, documented set of key combinations that never reach the terminal, moving the focus between the panes among them; every other key typed in a focused terminal shall reach it."

[[requirement]]
id = "FR-123"
release = "R1"
section = "Keyboard"
text = "The default key bindings of the review pane shall follow vim and tuicr wherever they have a binding for the action."

[[requirement]]
id = "FR-124"
release = "R1"
section = "Settings"
text = "The app shall let the user change inside the app what a turn end selects in Changes, the time before the language servers of an off-screen workspace stop, the theme, and the base of a workspace."

[[requirement]]
id = "FR-126"
release = "R1"
section = "Settings"
text = "The app shall show the user how much disk space its recorded states use, for each workspace and in total, and shall offer a control that cleans them up at once."

[[requirement]]
id = "NFR-001"
release = "R1"
section = "How well it does it"
text = "Adding support for another agent CLI shall require changes in one integration module and in no other part of the app."

[[requirement]]
id = "NFR-002"
release = "R1"
section = "How well it does it"
text = "Adding a built-in language shall require one entry in the table that maps a language to its server, and no change to the code that starts servers."

[[requirement]]
id = "NFR-003"
release = "R1"
section = "How well it does it"
text = "Adding another way of delivering a review to an agent shall require one module beside the existing ones."

[[requirement]]
id = "NFR-004"
release = "R1"
section = "How well it does it"
text = "Adding another kind of change that can be reviewed shall not require changes to comments, threads or rounds."

[[requirement]]
id = "NFR-005"
release = "R1"
section = "How well it does it"
text = "Adding a pane shall not require changes to the existing panes."

[[requirement]]
id = "NFR-006"
release = "Later"
section = "How well it does it"
text = "The app shall offer a plugin interface through which others add agent CLIs, languages, delivery mechanisms, kinds of change and panes."

[[requirement]]
id = "NFR-007"
release = "R1"
section = "How well it does it"
text = "The first release shall serve one reviewer on their own machine: it shall require no account and offer no sharing."

[[requirement]]
id = "NFR-008"
release = "R1"
section = "How well it does it"
text = "The app shall keep a draft comment from the moment it is written, across a quit, a crash and a restart of the machine."

[[requirement]]
id = "NFR-009"
release = "R1"
section = "How well it does it"
text = "On the reference Mac the app shall show the diff of a workspace within 0.3 s of a cold start."

[[requirement]]
id = "NFR-010"
release = "R1"
section = "How well it does it"
text = "On Ubuntu the app shall show the diff of a workspace within 0.3 s of a cold start, measured in the Ubuntu virtual machine of the project."

[[requirement]]
id = "NFR-011"
release = "R1"
section = "How well it does it"
text = "With one workspace open and idle, the app's own processes shall use at most 200 MB of resident memory, language servers and agent CLIs not counted."

[[requirement]]
id = "NFR-012"
release = "R1"
section = "How well it does it"
text = "A key typed in the terminal pane or in a comment box shall be on screen at most 10 ms later than the same key typed in Ghostty on the same machine, at the median and at the 95th percentile, timed from the key event to the frame that shows it; in the terminal pane also while the agent writes output."

[[requirement]]
id = "NFR-013"
release = "R1"
section = "How well it does it"
text = "While the reviewer scrolls a diff of 2,200 lines, unified or split, the app shall draw at the refresh rate of the display, up to 120 Hz, with at most 1% of the frames taking longer than two refresh intervals."

[[requirement]]
id = "NFR-014"
release = "R1"
section = "How well it does it"
text = "The terminal pane shall take a flood of 200,000 lines in at most 1.5 times the time the program that writes them needs alone."

[[requirement]]
id = "NFR-015"
release = "R1"
section = "How well it does it"
text = "The app itself shall be written in Rust and draw its own interface, with no web view and no JavaScript runtime in its own processes."

[[requirement]]
id = "NFR-016"
release = "R1"
section = "How well it does it"
text = "The first release shall run on macOS and on Linux and shall be tested on the current major version of macOS and the one before it, and on Debian and Ubuntu; it promises nothing for a Linux distribution that is not built on Debian."

[[requirement]]
id = "NFR-017"
release = "R1"
section = "How well it does it"
text = "The first release shall offer a dark and a light theme, and the user shall choose between them."

[[requirement]]
id = "NFR-018"
release = "R1"
section = "How well it does it"
text = "Until the user chooses a theme, the app shall follow the light or dark setting of the system."

[[requirement]]
id = "NFR-019"
release = "R1"
section = "How well it does it"
text = "Adding a theme shall require one theme definition and no change to the code that draws the interface."

[[requirement]]
id = "NFR-020"
release = "R1"
section = "How well it does it"
text = "The app shall not change the configuration of the user's agent CLI without asking."

[[requirement]]
id = "NFR-021"
release = "R1"
section = "How well it does it"
text = "The app shall leave nothing in the reviewed repository that `git status`, a diff or a commit can pick up."

[[requirement]]
id = "NFR-022"
release = "R1"
section = "How well it does it"
text = "The app shall follow the conventions of each platform for windows, menus and system shortcuts; its test is a checklist written in phase 6 and Matteo's sign-off."

[[requirement]]
id = "NFR-023"
release = "R1"
section = "How well it does it"
text = "The app shall never read or store a credential of an agent CLI: the user signs in to the CLI itself, with their own subscription."

[[requirement]]
id = "NFR-024"
release = "R1"
section = "How well it does it"
text = "The app shall be a standalone desktop application with a graphical interface."

[[requirement]]
id = "NFR-025"
release = "R1"
section = "How well it does it"
text = "The source of the app shall be published under an open-source licence."

[[requirement]]
id = "NFR-026"
release = "R1"
section = "How well it does it"
text = "Following the agent, delivering a review and reading the agent's replies shall not depend on the agent running in a terminal, so that an agent interface of the app's own can be added later."

[[requirement]]
id = "NFR-027"
release = "R1"
section = "How well it does it"
text = "The app shall not be a fork of Zed, an extension of VS Code or of tuicr, or a program that runs inside a terminal."

[[requirement]]
id = "NFR-028"
release = "R1"
section = "How well it does it"
text = "The first release shall be installable on macOS as a notarized application, on Debian and Ubuntu as a `.deb` package and from an apt repository, and on both systems by one install script."
