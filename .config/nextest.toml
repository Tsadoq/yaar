# Settings of `cargo nextest`, which CI runs the tests with.

# System tests that hold a Keeper to a time or load it heavily run one at a time: beside each other,
# their own load would be what they measure.
[test-groups]
timed = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(yaar-system-tests) & (binary(keeping) | binary(holding))"
test-group = "timed"

# The tests that run rust-analyzer load every core for seconds and would push the timed
# Keeper tests past their limits, so each takes every test thread.
[[profile.default.overrides]]
filter = "package(yaar-navigator) & (binary(=real) | binary(=old_real) | binary(=downloaded)) & test(rust)"
threads-required = "num-test-threads"
