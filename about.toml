# cargo-about 0.9. The same licences as deny.toml allows; a dependency under any other fails the
# generation.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
